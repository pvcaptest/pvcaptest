name: e2848_default
description: >-
  Standard ASTM E2848 regression of AC power against front-side POA irradiance,
  ambient temperature, and wind speed using the full four-term formula.
  This is the default setup for monofacial capacity tests.
reg_fml: power ~ poa + I(poa * poa) + I(poa * t_amb) + I(poa * w_vel) - 1
meas:
  reg_cols:
    power: {group: real_pwr_mtr, agg: sum}
    poa: {group: irr_poa, agg: mean}
    t_amb: {group: temp_amb, agg: mean}
    w_vel: {group: wind_speed, agg: mean}
sim:
  reg_cols:
    power: {column: E_Grid}
    poa: {column: GlobInc}
    t_amb: {column: T_Amb}
    w_vel: {column: WindVel}
rep_conditions:
  irr_bal: false
  percent_filter: 20
  func: {poa: perc_60, t_amb: mean, w_vel: mean}
scatter_plots: default
