name: bifi_power_tc_etotal_rear_shade_sim
description: >-
  The regression equation is temperature corrected power regressed against
  total POA irradiance. The back of module temperature is from field measurements
  and the cell temperature is calculated using the Sandia PV Array Performance
  Model from the POA irradiance and measured BOM temperature. Note that
  the PVsyst temperature correction uses the 'TArray' output variable. Rear
  shading and IAM losses are handled in the modeled (PVsyst) data: the modeled
  rear irradiance is rpoa_pvsyst = GlobBak + BackShd, while the measured
  rear sensor (irr_rpoa) is used as-measured. Leave CapTest's 'rear_shade'
  at its default of 0 with this setup: the rear shading is already carried
  by the modeled rear irradiance, and a non-zero 'rear_shade' is still applied
  to the measured e_total, double-counting the loss. To apply rear shading
  on the measured side instead, use 'bifi_power_tc_etotal_rear_shade_meas'.
  Total irradiance is E_Total = E_POA + E_Rear * bifaciality, following
  the NREL modified bifacial approach.
reg_fml: power ~ poa
meas:
  reg_cols:
    power:
      calc: power_temp_correct
      args:
        power: {group: real_pwr_mtr, agg: sum}
        cell_temp:
          calc: cell_temp
          args:
            poa: {group: irr_poa, agg: mean}
            bom: {group: temp_bom, agg: mean}
    poa:
      calc: e_total
      args:
        poa: {group: irr_poa, agg: mean}
        rpoa: {group: irr_rpoa, agg: mean}
sim:
  reg_cols:
    power:
      calc: power_temp_correct
      args:
        power: {column: E_Grid}
        cell_temp: {column: TArray}
    poa:
      calc: e_total
      args:
        poa: {column: GlobInc}
        rpoa:
          calc: rpoa_pvsyst
          args:
            globbak: {column: GlobBak}
            backshd: {column: BackShd}
params: {rear_shade: 0}
rep_conditions:
  irr_bal: false
  percent_filter: 20
  func: {poa: perc_60}
scatter_plots: etotal
