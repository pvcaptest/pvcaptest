name: bifi_e2848_etotal_rear_shade_sim
description: >-
  Standard ASTM E2848 regression form with total effective irradiance replacing
  front-side POA as the independent variable. Rear shading and IAM losses are
  handled in the modeled (PVsyst) data: the modeled rear irradiance is
  rpoa_pvsyst = GlobBak + BackShd, while the measured rear sensor (irr_rpoa) is
  used as-measured. Leave CapTest's 'rear_shade' at its default of 0 with this
  setup: the rear shading is already carried by the modeled rear irradiance, so
  this setup requires 'rear_shade' to be 0 (params: {rear_shade: 0}) and setup()
  raises SetupFitError for a non-zero value rather than double-counting the
  loss. To apply rear shading on the measured side instead, use
  'bifi_e2848_etotal_rear_shade_meas'. Total irradiance is E_Total = E_POA +
  E_Rear * bifaciality, following the NREL modified bifacial approach.
reg_fml: power ~ poa + I(poa * poa) + I(poa * t_amb) + I(poa * w_vel) - 1
meas:
  reg_cols:
    power: {group: real_pwr_mtr, agg: sum}
    poa:
      calc: e_total
      args:
        poa: {group: irr_poa, agg: mean}
        rpoa: {group: irr_rpoa, agg: mean}
    t_amb: {group: temp_amb, agg: mean}
    w_vel: {group: wind_speed, agg: mean}
sim:
  reg_cols:
    power: {column: E_Grid}
    poa:
      calc: e_total
      args:
        poa: {column: GlobInc}
        rpoa:
          calc: rpoa_pvsyst
          args:
            globbak: {column: GlobBak}
            backshd: {column: BackShd}
    t_amb: {column: T_Amb}
    w_vel: {column: WindVel}
params: {rear_shade: 0}
rep_conditions:
  irr_bal: false
  percent_filter: 20
  func: {poa: perc_60, t_amb: mean, w_vel: mean}
scatter_plots: etotal
