kind: pr
name: pr_plain_bifi
description: >-
  Bifacial performance ratio without temperature correction. The irradiance
  is the total effective irradiance, E_Total = E_POA + E_Rear * bifaciality,
  following the NREL modified bifacial approach. Rear shading and IAM losses
  are handled in the modeled (PVsyst) data: the modeled rear irradiance is
  rpoa_pvsyst = GlobBak + BackShd, while the measured rear sensor (irr_rpoa)
  is used as-measured. This setup requires CapTest's 'rear_shade' to be 0
  (params: {rear_shade: 0}) so the loss is not double-counted. The front POA
  is kept as the 'front_poa' role. For the monofacial test, see 'pr_plain'.
temp_corrected: false
params: {rear_shade: 0}
meas:
  reg_cols:
    power: {group: real_pwr_mtr, agg: sum}
    poa:
      calc: e_total
      args:
        poa: {group: irr_poa, agg: mean}
        rpoa: {group: irr_rpoa, agg: mean}
    front_poa: {group: irr_poa, agg: mean}
sim:
  reg_cols:
    power: {column: E_Grid}
    poa:
      calc: e_total
      args:
        poa: {column: GlobInc}
        rpoa:
          calc: rpoa_pvsyst
          args:
            globbak: {column: GlobBak}
            backshd: {column: BackShd}
    front_poa: {column: GlobInc}
