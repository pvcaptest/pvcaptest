kind: pr
name: pr_tc_meas_bom_bifi
description: >-
  Bifacial temperature-corrected performance ratio, contract variant, Tref
  from PVsyst TArray. The irradiance is the total effective irradiance, with
  rear shading carried by the modeled rpoa_pvsyst (this setup requires
  CapTest's 'rear_shade' to be 0). The measured cell temperature is
  calculated with the Sandia PV Array Performance Model from the front POA
  irradiance and the measured back of module temperature (temp_bom); the
  modeled cell temperature is the PVsyst 'TArray' output variable. Not the NREL
  protocol. Requires CapTest's 'power_temp_coeff'. See also 'pr_tc_meas_bom'.
temp_corrected: true
params: {rear_shade: 0}
meas:
  reg_cols:
    power: {group: real_pwr_mtr, agg: sum}
    poa:
      calc: e_total
      args:
        poa: {group: irr_poa, agg: mean}
        rpoa: {group: irr_rpoa, agg: mean}
    front_poa: {group: irr_poa, agg: mean}
    cell_temp:
      calc: cell_temp
      args:
        bom: {group: temp_bom, agg: mean}
        poa: {group: irr_poa, agg: mean}
sim:
  reg_cols:
    power: {column: E_Grid}
    poa:
      calc: e_total
      args:
        poa: {column: GlobInc}
        rpoa:
          calc: rpoa_pvsyst
          args:
            globbak: {column: GlobBak}
            backshd: {column: BackShd}
    front_poa: {column: GlobInc}
    cell_temp: {column: TArray}
